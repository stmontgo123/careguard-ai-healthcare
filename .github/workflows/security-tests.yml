name: CareGuard Security Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run security acceptance tests
        run: python scripts/security_tests.py

      - name: Run deterministic demo smoke test
        run: python -m src.healthcare_rag_demo --no-ollama
